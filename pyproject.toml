[project]
name = "strata-contracts"
version = "0.1.0"
description = "What crosses a boundary between strata packages: sample types and the prepared index going into a catalog, annotation values and schemas, the manifest a trainer is handed"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    # The entry-point resolver, for sample types. Nothing else: its extras
    # are what the packages running migrations or services need.
    "strata-common>=0.1,<0.2",
]

# What a catalog can take, read from what is installed. A plugin registers
# here too; these names are reserved so one cannot replace them.
[project.entry-points."strata.sample_types"]
image = "strata.contracts.builtin_types:Image"
frames = "strata.contracts.builtin_types:Frames"
text = "strata.contracts.builtin_types:Text"

# What developing this package alone needs beyond its extras. Inside the
# strata workspace the root's group is used instead.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# The same set as every strata package: pinned, widened once, on purpose.
select = ["E", "F", "I", "B", "SIM", "DTZ", "UP", "C4", "RUF"]

[tool.ruff.lint.isort]
# The namespace is one project however many repositories hold it, so a
# sibling package sorts with this one and not with the third parties.
known-first-party = ["strata"]

[tool.pyright]
include = ["strata"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no strata/__init__.py in any package, or they stop merging
packages = ["strata"]
